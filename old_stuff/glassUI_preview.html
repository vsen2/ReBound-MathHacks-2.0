<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass UI Preview</title>
  <style>
    :root {
      --bg1: #e9f3f4;
      --bg2: #dfeaf7;
      --glass: rgba(255,255,255,0.28);
      --glass-strong: rgba(255,255,255,0.42);
      --text: #214d5b;
      --border: rgba(255,255,255,0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(140, 205, 255, 0.7), transparent 25%),
        radial-gradient(circle at 80% 15%, rgba(180, 235, 208, 0.7), transparent 22%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }
    .card {
      width: min(720px, 82vw);
      padding: 34px 30px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.34), rgba(255,255,255,0.12));
      border: 1px solid rgba(255,255,255,0.58);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      box-shadow: 0 18px 38px rgba(35,67,92,0.12), inset 0 1px 0 rgba(255,255,255,0.7);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.15));
      pointer-events: none;
    }
    h1 {
      margin: 0 0 12px;
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.06em;
    }
    p {
      margin: 0;
      position: relative;
      z-index: 1;
      color: rgba(33,77,91,0.8);
      line-height: 1.6;
    }
    .chips {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .chip {
      padding: 10px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(214,236,255,0.42));
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Clear glass panels</h1>
    <p>These surfaces are more translucent and more visibly frosted so the background shines through without losing readability.</p>
    <div class="chips">
      <span class="chip">glass UI</span>
      <span class="chip">clear panels</span>
      <span class="chip">frosted blur</span>
    </div>
  </div>
</body>
</html>
